<style>
/* GemPoint Sales brand: navy + emerald, Source Serif 4 headlines over Inter. Layout: intake → six graded sections → scored report with gaps and a 90-day plan */
:root{
  --bg:#FAFAF7; --surface:#FFFFFF; --ink:#10244A; --muted:#4B5B76; --line:#DCE2EA;
  --accent:#0A7B57; --accent-soft:#D3F0E3; --on-accent:#FFFFFF;
  --bad:#B42318; --bad-soft:#FBE7E5; --warn:#A54C08; --warn-soft:#FBEBDD; --good:#0A7B57; --good-soft:#D3F0E3;
  --cta:#10244A; --on-cta:#FFFFFF; --cta-muted:#C9D2E1; --cta-btn:#3CC08E; --on-cta-btn:#0B1A33;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A33; --surface:#12254A; --ink:#EEF2F8; --muted:#A8B5CB; --line:#263B63;
  --accent:#3CC08E; --accent-soft:#1E4A40; --on-accent:#0B1A33;
  --bad:#F97066; --bad-soft:#3A1E26; --warn:#F5A524; --warn-soft:#3A2A12; --good:#3CC08E; --good-soft:#1E4A40;
  --cta:#1B3562; --on-cta:#FFFFFF; --cta-muted:#C9D2E1; --cta-btn:#3CC08E; --on-cta-btn:#0B1A33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A33; --surface:#12254A; --ink:#EEF2F8; --muted:#A8B5CB; --line:#263B63;
  --accent:#3CC08E; --accent-soft:#1E4A40; --on-accent:#0B1A33;
  --bad:#F97066; --bad-soft:#3A1E26; --warn:#F5A524; --warn-soft:#3A2A12; --good:#3CC08E; --good-soft:#1E4A40;
  --cta:#1B3562; --on-cta:#FFFFFF; --cta-muted:#C9D2E1; --cta-btn:#3CC08E; --on-cta-btn:#0B1A33; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
[hidden]{display:none!important}
.err{color:var(--bad);font-size:.9rem;font-weight:600}
.fine{font-size:.85rem;color:var(--muted)}
.wrap{max-width:820px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2.1rem,6vw,3.4rem);font-weight:600;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:600}
h3{font-family:var(--body);font-size:1.1rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--body);font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:20px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.brandbar svg{height:56px;width:auto;display:block}
.brandbar .lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brandbar .lg-light{display:none}:root:not([data-theme="light"]) .brandbar .lg-dark{display:block}}
:root[data-theme="dark"] .brandbar .lg-light{display:none}:root[data-theme="dark"] .brandbar .lg-dark{display:block}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.opt input:focus-visible+span,.chip input:focus-visible+span,a:focus-visible,select:focus-visible,input[type=text]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent)}

/* Intro */
.hero{display:flex;flex-direction:column;gap:18px;padding-bottom:28px;border-bottom:2px solid var(--accent)}
.hero .lede{font-size:1.2rem;max-width:58ch}
.byline{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:28px 0}
.gets div{min-width:0}
.gets b{display:block;font-family:var(--body);font-weight:600;font-size:1.05rem;margin-bottom:4px}
.areas{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--body);font-size:.78rem;border:1px solid var(--line);border-radius:4px;padding:4px 10px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem}
input[type=text],select{font:inherit;font-weight:400;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1.5px solid var(--line);border-radius:6px;padding:8px 14px;font-weight:600;font-size:.95rem;cursor:pointer}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:600;font-size:.95rem;margin-bottom:8px;padding:0}

/* Questions */
.progress{display:flex;gap:4px;margin:18px 0 6px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}
.q{padding:20px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q legend{font-size:1.08rem;font-weight:600;margin-bottom:12px;line-height:1.4}
.q .n{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-right:6px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:6px;padding:8px 2px;cursor:pointer;text-align:center;font-size:.8rem;color:var(--muted);line-height:1.2}
.opt span b{font-family:var(--mono);font-size:1.05rem;color:var(--ink)}
.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt input:checked+span b{color:var(--on-accent)}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.hint{font-size:.9rem;color:var(--muted)}

/* Report */
.rhead{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-bottom:28px;border-bottom:2px solid var(--accent)}
@media (max-width:560px){.rhead{grid-template-columns:1fr}}
.ring{width:150px;height:150px}
.ring text{font-family:var(--mono);font-weight:700;fill:var(--ink)}
.pill{display:inline-block;font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-good{background:var(--good-soft);color:var(--good)}
section.block{padding:32px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,190px) 1fr 44px;gap:12px;align-items:center}
@media (max-width:520px){.bar{grid-template-columns:1fr 44px}.bar .track{grid-column:1 / -1;grid-row:2}}
.bar .lbl{font-weight:600;font-size:.95rem;min-width:0}
.track{height:12px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.track::after{content:"";position:absolute;left:60%;top:0;bottom:0;border-left:2px dashed var(--muted);opacity:.5}
.num{font-family:var(--mono);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.legend{font-size:.85rem;color:var(--muted)}
.priority{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard .when{font-family:var(--mono);font-size:.78rem;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pcard ul,.cat ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cat{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cat.s-bad{border-left-color:var(--bad)} .cat.s-warn{border-left-color:var(--warn)} .cat.s-good{border-left-color:var(--good)}
.cat .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.sub{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kit{font-size:.9rem;color:var(--muted)}
.cta{background:var(--cta);color:var(--on-cta);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:14px}
.cta h2{color:var(--on-cta)}
.cta p{color:var(--cta-muted)}
.cta .btn{background:var(--cta-btn);color:var(--on-cta-btn)}
.cta .btn.ghost{background:transparent;color:var(--on-cta);border-color:#A8B5CB}
.contact{font-family:var(--mono);font-size:.9rem;user-select:all}
.toast{font-size:.9rem;min-height:1.4em}
.samplenote{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:.9rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .7s ease}}
</style>

const CATS = [
 {id:"strat", name:"Strategy & ICP", kit:"ICP & persona worksheet, Sales Playbook template",
  low:"Sellers are chasing any deal that moves. Without a shared picture of the best-fit customer, effort spreads thin and win rates suffer.",
  mid:"You have a sense of who you sell to, but it isn't written down tightly enough for every seller to apply it the same way.",
  high:"Your targeting is clear and documented. This is a foundation to build the rest of the system on.",
  qs:[
   {t:"We have a written ideal customer profile that every seller describes the same way.", fix:"Write a one-page ICP: company size, industry, buying triggers, and clear disqualifiers."},
   {t:"Our value proposition is documented and tied to specific buyer pains.", fix:"Write one value statement per buyer persona, each tied to a pain the buyer can measure."},
   {t:"Revenue targets are broken down by quarter, by rep, and by lead source.", fix:"Split the annual number into quarterly quotas by rep and by source so gaps show up early."},
   {t:"We know our win rate and our top reasons for losing deals.", fix:"Tag every lost deal with a reason and review the top three in a monthly meeting."}]},
 {id:"proc", name:"Sales Process", kit:"Sales process map, discovery call script, proposal templates",
  low:"Every rep sells their own way, so results depend on who works the deal. That makes it hard to coach, forecast, or scale.",
  mid:"A process exists but is applied unevenly. Tightening stage definitions and discovery will make results more predictable.",
  high:"Your process is defined and followed. Keep refining it with win/loss data.",
  qs:[
   {t:"Our sales stages have written entry and exit criteria.", fix:"Define 5–7 stages, each with a buyer action that must happen before a deal moves forward."},
   {t:"Every rep runs discovery the same way, using a shared question framework.", fix:"Build a discovery script with 10–15 core questions and role-play it with each rep."},
   {t:"We use a qualification framework (such as BANT or MEDDIC) on every deal.", fix:"Pick one qualification framework and add its fields to every opportunity in the CRM."},
   {t:"Proposals and follow-ups follow a standard template and timeline.", fix:"Standardize the proposal outline and send a written recap within 24 hours of every meeting."}]},
 {id:"pipe", name:"Pipeline & Forecasting", kit:"Pipeline tracker & KPI dashboard, weekly meeting agendas",
  low:"The forecast is a guess and the pipeline is too thin or too stale to hit the number. Surprises at quarter end are likely.",
  mid:"You have visibility into the pipeline, but coverage or forecast accuracy needs work.",
  high:"Your pipeline is healthy and your forecast is reliable. Use that confidence to plan hiring and spend.",
  qs:[
   {t:"Our pipeline holds at least 3x the current quarter's target.", fix:"Track pipeline coverage weekly and trigger a prospecting push whenever it drops below 3x."},
   {t:"Our forecast usually lands within 10% of actual results.", fix:"Forecast only from deals that meet stage exit criteria, and compare forecast to actual every month."},
   {t:"Stalled deals are flagged and reviewed every week.", fix:"Flag any deal with no activity in 14 days and decide in the weekly review: advance it or close it."},
   {t:"We hold a weekly pipeline review with a consistent agenda.", fix:"Run a 45-minute weekly pipeline review with the same agenda: new, moved, stalled, and committed deals."}]},
 {id:"people", name:"People & Coaching", kit:"90-day rep onboarding plan, 1:1 agendas",
  low:"Reps are mostly on their own. Ramp time is long, turnover is expensive, and top performance isn't being copied.",

  high:"You develop sellers well. This is a real advantage as you add headcount.",
  qs:[
   {t:"New reps reach full productivity within 90 days.", fix:"Build a week-by-week 90-day onboarding plan with checkpoints a rep must pass."},
   {t:"Managers coach reps on real deals for at least 2 hours per rep each month.", fix:"Schedule a recurring deal-coaching 1:1 with each rep and review one live deal every session."},
   {t:"Our compensation plan rewards the behaviors we actually want.", fix:"Audit the comp plan against your goals: margin, new logos, retention. Pay for what matters most."},
   {t:"We use a defined hiring profile and structured interviews for sellers.", fix:"Write a seller scorecard and use the same interview questions and role-play for every candidate."}]},
 {id:"gen", name:"Prospecting & Lead Gen", kit:"Outbound sequence pack, AI prompt pack",
  low:"New business depends on referrals or the founder. When those slow down, so does revenue.",

   {t:"Inbound leads get a response within one business hour.", fix:"Set up instant lead alerts and a one-hour response rule with a named owner."}]},
 {id:"tools", name:"Tools, Data & Metrics", kit:"Pipeline tracker & KPI dashboard",
  low:"Leaders are flying blind. Without clean CRM data and a few core metrics, it's hard to see what's working.",
  mid:"The tools are in place, but data quality or reporting habits are holding you back.",
  high:"Your data is trustworthy and leaders use it. That makes every other fix easier to measure.",
  qs:[
   {t:"Every deal and activity is tracked in a CRM that reps keep current.", fix:"Make the CRM the only source for pipeline reviews: if it isn't in the CRM, it isn't discussed."},
   {t:"We review a short set of sales KPIs every week.", fix:"Pick 5–7 KPIs (activities, meetings, pipeline added, win rate, cycle length) and review them weekly."},
   {t:"Leaders can see conversion rates between each sales stage.", fix:"Build a stage-conversion report so you can see exactly where deals drop out."},
   {t:"We use automation or AI to cut admin work for sellers.", fix:"Automate call notes, follow-up drafts, and CRM updates so reps spend more time selling."}]}
];

const INTAKE = [
 {id:"size", label:"How many people sell (including you)?", opts:["Just me","2–5","6–10","11+"]},
 {id:"rev", label:"Annual revenue", opts:["Under $1M","$1M–$5M","$5M–$20M","$20M+"]},
 {id:"lead", label:"Who leads sales today?", opts:["Founder / owner","A sales manager","No one specifically"]}
];

const SAMPLE = {intake:{company:"Example Co. (sample)",size:"2–5",rev:"$1M–$5M",lead:"Founder / owner"},
  ans:{strat:[3,2,3,2],proc:[2,3,1,3],pipe:[2,1,2,3],people:[2,1,3,1],gen:[3,4,3,4],tools:[5,4,4,3]}};

let state = {view:"intro", step:0, intake:{company:"",size:"",rev:"",lead:""}, ans:{}, sample:false,
  contact:{name:"",email:"",phone:""}, submitted:false};
CATS.forEach(c=>state.ans[c.id]=[0,0,0,0]);

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const scoreOf = arr => Math.round((arr.reduce((a,b)=>a+b,0)/arr.length-1)/4*100);
const band = s => s<40?"bad":s<60?"warn":"good";
const bandLabel = s => s<40?"Gap":s<60?"Developing":"Strength";
const tier = s => s<40?["Founder-dependent","Sales runs on individual effort, not a system. The upside from building one is large."]
  : s<60?["Building","Pieces of a system exist. Closing the biggest gaps will make growth more predictable."]
  : s<80?["Scaling","You have a working system. Targeted fixes will raise win rates and shorten ramp time."]
  : ["Optimized","Your sales engine is strong. Focus on fine-tuning and protecting what works."];

function render(){
  if(state.view==="intro") return renderIntro();
  if(state.view==="q") return renderQ();
  if(state.view==="gate") return renderGate();
  return renderReport();
}

function renderIntro(){
  const i = state.intake;
  app.innerHTML = `
  <header class="hero">
    <span class="eyebrow">Free 5-minute assessment · 24 questions</span>
    <h1>How strong is your sales engine?</h1>
    <p class="lede">Rate your team across the six areas that decide whether revenue is repeatable. You'll get a scored report with your biggest gaps, quick wins, and a 90-day plan to fix them.</p>
    <p class="byline">Built by ${esc(CONTACT.name)}, ${esc(CONTACT.title)}.</p>
  </header>
  <div class="gets">
    <div><b>Your score by area</b><span class="muted">See where you're strong and where deals are leaking.</span></div>
    <div><b>Specific fixes</b><span class="muted">Every weak answer comes with a concrete next step.</span></div>
    <div><b>A 90-day plan</b><span class="muted">Your top three priorities, sequenced month by month.</span></div>
  </div>
  <div class="areas" aria-label="Areas assessed">${CATS.map(c=>`<span class="tag">${esc(c.name)}</span>`).join("")}</div>
  <form class="panel stack" id="intake" style="margin-top:28px" novalidate>
    <h3>A little about your team</h3>
    <label class="f" for="company">Company name (optional)
      <input type="text" id="company" value="${esc(i.company)}" autocomplete="organization"></label>
    ${INTAKE.map(q=>`<fieldset><legend>${esc(q.label)}</legend><div class="chips">${q.opts.map((o,k)=>`
      <label class="chip"><input type="radio" name="${q.id}" id="${q.id}-${k}" value="${esc(o)}" ${i[q.id]===o?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div></fieldset>`).join("")}
    <div class="row">
      <button class="btn" type="submit" id="start">Start the assessment</button>
      <button class="btn ghost" type="button" id="sample">See a sample report</button>
    </div>
  </form>`;
  const f = document.getElementById("intake");
  f.addEventListener("submit",e=>{
    e.preventDefault();
    state.intake.company = document.getElementById("company").value.trim();
    INTAKE.forEach(q=>{const c=f.querySelector(`input[name="${q.id}"]:checked`); state.intake[q.id]=c?c.value:"";});
    state.sample=false; state.view="q"; state.step=0; render(); window.scrollTo(0,0);
  });
  document.getElementById("sample").addEventListener("click",()=>{
    state.intake = {...SAMPLE.intake};
    Object.keys(SAMPLE.ans).forEach(k=>state.ans[k]=[...SAMPLE.ans[k]]);
    state.sample=true; state.view="report"; render(); window.scrollTo(0,0);
  });
}

function renderQ(){
  const c = CATS[state.step], a = state.ans[c.id], base = state.step*4;
  app.innerHTML = `
  <span class="eyebrow">Section ${state.step+1} of ${CATS.length}</span>
  <div class="progress" aria-hidden="true">${CATS.map((_,k)=>`<i class="${k<=state.step?"done":""}"></i>`).join("")}</div>
  <h2 style="margin-top:14px">${esc(c.name)}</h2>
  <p class="hint" style="margin-top:6px">How true is each statement for your team today? Answer for how things actually work, not how they should.</p>
  <form id="qf" style="margin-top:12px" novalidate>
    ${c.qs.map((q,k)=>`<fieldset class="q"><legend><span class="n">${String(base+k+1).padStart(2,"0")}</span>${esc(q.t)}</legend>
      <div class="scale">${SCALE.map(([v,l])=>`<label class="opt"><input type="radio" name="q${k}" id="${c.id}-${k}-${v}" value="${v}" ${a[k]==v?"checked":""}><span><b>${v}</b>${l}</span></label>`).join("")}</div></fieldset>`).join("")}
    <div class="navrow">
      <button type="button" class="btn ghost" id="back">${state.step===0?"Back to start":"Previous"}</button>
      <button type="submit" class="btn" id="next" ${a.includes(0)?"disabled":""}>${state.step===CATS.length-1?"See my report":"Next section"}</button>
    </div>
  </form>`;
  const f = document.getElementById("qf"), next = document.getElementById("next");
  f.addEventListener("change",e=>{
    const k = +e.target.name.slice(1); a[k] = +e.target.value; next.disabled = a.includes(0);
  });
  f.addEventListener("submit",e=>{
    e.preventDefault(); if(a.includes(0)) return;
    if(state.step<CATS.length-1){state.step++;} else {state.view="gate";}
    render(); window.scrollTo(0,0);
  });
  document.getElementById("back").addEventListener("click",()=>{
    if(state.step===0) state.view="intro"; else state.step--; render(); window.scrollTo(0,0);
  });
}

function renderGate(){
  const c = state.contact;
  app.innerHTML = `
  <span class="eyebrow">Last step</span>
  <div class="progress" aria-hidden="true">${CATS.map(()=>`<i class="done"></i>`).join("")}</div>
  <h2 style="margin-top:14px">Your report is ready</h2>
  <p class="hint" style="margin-top:6px">Tell us where to reach you and your full scorecard opens on the next screen.</p>
  <form class="panel stack" id="gf" style="margin-top:20px" novalidate>
    <div class="grid2">
      <label class="f" for="lead-name">Your name
        <input type="text" id="lead-name" autocomplete="name" value="${esc(c.name)}" required></label>
      <label class="f" for="lead-email">Work email
        <input type="text" id="lead-email" inputmode="email" autocomplete="email" value="${esc(c.email)}" required></label>
      <label class="f" for="lead-phone">Phone (optional)
        <input type="text" id="lead-phone" inputmode="tel" autocomplete="tel" value="${esc(c.phone)}"></label>
      <label class="f" for="lead-company">Company
        <input type="text" id="lead-company" autocomplete="organization" value="${esc(state.intake.company)}"></label>
    </div>
    <p class="err" id="gerr" aria-live="polite"></p>
    <div class="navrow" style="margin-top:0">
      <button type="button" class="btn ghost" id="gback">Previous</button>
      <button type="submit" class="btn" id="gsend">Show my report</button>
    </div>
    <p class="fine">${esc(CONTACT.name)} will see your results and may follow up once. No spam, and your information is never sold.</p>
  </form>`;
  document.getElementById("gback").addEventListener("click",()=>{state.view="q"; state.step=CATS.length-1; render();});
  document.getElementById("gf").addEventListener("submit", async e=>{
    e.preventDefault();
    const name = document.getElementById("lead-name").value.trim();
    const email = document.getElementById("lead-email").value.trim();
    const err = document.getElementById("gerr");
    if(!name){err.textContent="Enter your name to see your report."; return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent="Enter a valid email address, like you@company.com."; return;}
    const phone = document.getElementById("lead-phone").value.trim();
    if(phone && phoneDigits(phone).length!==10){err.textContent="Enter a 10-digit phone number, like (864) 555-0100, or leave it blank."; return;}
    state.contact = {name, email, phone:formatPhone(phone)};
    state.intake.company = document.getElementById("lead-company").value.trim();
    const btn = document.getElementById("gsend"); btn.disabled = true; btn.textContent = "Building your report…";
    try { await sendLead(); state.submitted = true; } catch(x) { state.submitted = false; }
    state.view = "report"; render(); window.scrollTo(0,0);
  });
}

async function sendLead(){
  const {cats, overall, ranked} = analyze();
  const byId = Object.fromEntries(cats.map(c=>[c.id,c.s]));
  const answers = cats.map(c=>`${c.name}: ${c.qs.map((q,k)=>`Q${k+1}=${c.a[k]}`).join(", ")}`).join("\n");
  const fields = {
    "form-name":"scorecard-leads", "bot-field":"",
    name:state.contact.name, email:state.contact.email, phone:state.contact.phone, company:state.intake.company,
    team_size:state.intake.size, revenue:state.intake.rev, sales_lead:state.intake.lead,
    overall:String(overall), tier:tier(overall)[0],
    top_priorities:ranked.slice(0,3).map(c=>`${c.name} (${c.s})`).join("; "),
    strategy_icp:String(byId.strat), sales_process:String(byId.proc), pipeline_forecasting:String(byId.pipe),
    people_coaching:String(byId.people), prospecting:String(byId.gen), tools_metrics:String(byId.tools),
    answers
  };
  const res = await fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(fields).toString()});
  if(!res.ok) throw new Error("submit failed");
}

function analyze(){
  const cats = CATS.map(c=>{
    const a = state.ans[c.id], s = scoreOf(a);
    return {...c, a, s, gaps:c.qs.filter((q,k)=>a[k]<=2), tune:c.qs.filter((q,k)=>a[k]===3)};
  });
  const overall = Math.round(cats.reduce((t,c)=>t+c.s,0)/cats.length);
  const ranked = [...cats].sort((x,y)=>x.s-y.s);
  return {cats, overall, ranked};
}

function ring(score){
  const r=62, C=2*Math.PI*r, off=C*(1-score/100), col=`var(--${band(score)})`;
  return `<svg class="ring" viewBox="0 0 150 150" role="img" aria-label="Overall score ${score} out of 100">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 75 75)"/>
    <text x="75" y="80" text-anchor="middle" font-size="38">${score}</text>
    <text x="75" y="104" text-anchor="middle" font-size="12" style="fill:var(--muted)">out of 100</text></svg>`;
}

function contextNotes(){
  const n = [], i = state.intake;
  if(i.lead==="Founder / owner") n.push("Sales is founder-led. The biggest lever is getting what's in your head onto paper so others can sell without you.");
  if(i.lead==="No one specifically") n.push("No one owns sales leadership. A fractional sales leader can install the system without the cost of a full-time hire.");
  if(i.size==="6–10"||i.size==="11+") n.push("With a team this size, inconsistent process costs more every month. Standardizing now pays off quickly.");
  return n;
}

function renderReport(){
  const {cats, overall, ranked} = analyze();
  const [tname, tdesc] = tier(overall);
  const who = state.intake.company ? esc(state.intake.company) : "Your team";
  const strengths = cats.filter(c=>c.s>=60).sort((x,y)=>y.s-x.s);
  const quick = cats.flatMap(c=>c.tune.map(q=>({c:c.name,q}))).slice(0,5);
  const plan = ranked.slice(0,3);
  const months = ["Days 1–30","Days 31–60","Days 61–90"];
  const notes = contextNotes();
  const hasCTA = CONTACT.email || CONTACT.booking;

  app.innerHTML = `
  ${state.sample?`<p class="samplenote" style="margin-bottom:18px">This is a sample report with example answers. Take the assessment to see your own.</p>`:""}
  <header class="rhead">
    ${ring(overall)}
    <div class="stack" style="gap:10px;min-width:0">
      <span class="eyebrow">Sales Team Scorecard · ${who}</span>
      <h1 style="font-size:clamp(2rem,5vw,2.8rem)">${tname}</h1>
      <p>${tdesc}</p>
      ${notes.map(x=>`<p class="muted">${x}</p>`).join("")}
    </div>
  </header>

  <section class="block">
    <h2>Score by area</h2>
    <div class="bars">${cats.map(c=>`<div class="bar"><span class="lbl">${esc(c.name)}</span>
      <div class="track"><i style="width:${Math.max(c.s,2)}%;background:var(--${band(c.s)})"></i></div>
      <span class="num">${c.s}</span></div>`).join("")}</div>
    <p class="legend">Dashed line marks 60, the point where an area starts working as a strength. Below 40 is a gap that's likely costing you deals.</p>
  </section>

  <section class="block">
    <h2>Your 90-day plan</h2>
    <p class="muted">Start with your three lowest-scoring areas, one per month.</p>
    <div class="priority">${plan.map((c,k)=>{
      const items = (c.gaps.length?c.gaps:c.tune.length?c.tune:c.qs).slice(0,3);
      return `<div class="pcard"><span class="when">${months[k]}</span><h3>${esc(c.name)}</h3>
        <span><span class="pill p-${band(c.s)}">${c.s} · ${bandLabel(c.s)}</span></span>
        <ul>${items.map(q=>`<li>${esc(q.fix)}</li>`).join("")}</ul></div>`;}).join("")}</div>
  </section>

  ${quick.length?`<section class="block">
    <h2>Quick wins</h2>
    <p class="muted">You're partway there on these. A small push turns each into a strength.</p>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${quick.map(x=>`<li><b>${esc(x.c)}:</b> ${esc(x.q.fix)}</li>`).join("")}</ul>
  </section>`:""}

  ${strengths.length?`<section class="block">
    <h2>Strengths to build on</h2>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px">${strengths.map(c=>`<li><b>${esc(c.name)} (${c.s}):</b> ${esc(c.high)}</li>`).join("")}</ul>
  </section>`:""}

  <section class="block">
    <h2>Full playbook by area</h2>
    ${ranked.map(c=>{
      const b = band(c.s), diag = c.s<40?c.low:c.s<60?c.mid:c.high;
      return `<div class="cat s-${b}">
        <div class="top"><h3>${esc(c.name)}</h3><span class="pill p-${b}">${c.s} · ${bandLabel(c.s)}</span></div>
        <p>${esc(diag)}</p>
        ${c.gaps.length?`<div><p class="sub">Gaps to fix</p><ul>${c.gaps.map(q=>`<li>${esc(q.fix)}</li>`).join("")}</ul></div>`:""}
        ${c.tune.length?`<div><p class="sub">Tune up</p><ul>${c.tune.map(q=>`<li>${esc(q.fix)}</li>`).join("")}</ul></div>`:""}
        <p class="kit">Tools that help: ${esc(c.kit)}</p>
      </div>`;}).join("")}
  </section>

  <section class="block" style="border-bottom:0">
    <div class="cta">
      <span class="eyebrow" style="color:var(--cta-btn)">Next step</span>
      <h2>Want help closing these gaps?</h2>
      <p>GemPoint Sales puts a seasoned, fractional VP of Sales inside B2B teams to install the process, pipeline discipline, and coaching rhythm this report points to, without a full-time hire.
      ${state.submitted ? "We have a copy of your results, so a free 30-minute review can start right where this report ends." : "Copy your results and send them over for a free 30-minute review."}</p>
      ${CONTACT.email?`<p class="contact">${esc(CONTACT.email)}</p>`:""}
      <div class="row">
        ${CONTACT.booking?`<a class="btn" href="${esc(CONTACT.booking)}" target="_blank" rel="noopener">Book a free review</a>`:""}
        <button class="btn ${CONTACT.booking?"ghost":""}" id="copy" type="button">Copy my results</button>
        <button class="btn ghost" id="retake" type="button">${state.sample?"Take the assessment":"Retake"}</button>
      </div>
      <p class="toast" id="toast" aria-live="polite"></p>
      <textarea id="copytext" readonly hidden style="width:100%;min-height:160px;font:inherit;font-size:.85rem;color:var(--ink);background:var(--bg)"></textarea>
    </div>
  </section>`;

  document.getElementById("retake").addEventListener("click",()=>{
    CATS.forEach(c=>state.ans[c.id]=[0,0,0,0]);
    if(state.sample) state.intake={company:"",size:"",rev:"",lead:""};
    state.sample=false; state.submitted=false; state.view="intro"; state.step=0; render(); window.scrollTo(0,0);
  });
  document.getElementById("copy").addEventListener("click",()=>{
    const txt = summaryText(cats, overall, tname, plan);
    const toast = document.getElementById("toast"), ta = document.getElementById("copytext");
    const fallback = ()=>{ta.value=txt; ta.hidden=false; ta.focus(); ta.select(); toast.textContent="Select all and copy the text below.";};
    try{
      navigator.clipboard.writeText(txt).then(()=>{toast.textContent="Results copied. Paste them into an email.";}, fallback);
    }catch(e){fallback();}
  });
}

function summaryText(cats, overall, tname, plan){
  const i = state.intake;
  return [
    `Sales Team Scorecard${i.company?" — "+i.company:""}`,
    `Overall: ${overall}/100 (${tname})`,
    `Team: ${i.size||"n/a"} sellers · Revenue: ${i.rev||"n/a"} · Sales led by: ${i.lead||"n/a"}`,
    ``,
    `Scores by area:`,
    ...cats.map(c=>`- ${c.name}: ${c.s}`),
    ``,
    `Top priorities:`,
    ...plan.map((c,k)=>`${k+1}. ${c.name} (${c.s})`)
  ].join("\n");
}

render();
</script>


<script>
/* Phone fields (autocomplete="tel"): format as (xxx) xxx-xxxx while typing or pasting. */
(function(){
  function digits(v){ var d=String(v||"").replace(/\D/g,""); if(d.length===11&&d.charAt(0)==="1") d=d.slice(1); return d.slice(0,10); }
  function fmt(v){ var d=digits(v); if(!d) return "";
    if(d.length<4) return "("+d; if(d.length<7) return "("+d.slice(0,3)+") "+d.slice(3);
    return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6); }
  window.phoneDigits=digits; window.formatPhone=fmt;
  document.addEventListener("input",function(e){
    var t=e.target; if(!t||t.getAttribute("autocomplete")!=="tel") return;
    var before=t.value.slice(0,t.selectionStart||0).replace(/\D/g,"").length;
    var f=fmt(t.value); if(f===t.value) return; t.value=f;
    var pos=0,seen=0; while(pos<f.length&&seen<before){ if(/\d/.test(f.charAt(pos))) seen++; pos++; }
    try{ t.setSelectionRange(pos,pos); }catch(_){}
  });
})();
</script>
