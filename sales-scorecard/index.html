<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Team Scorecard | GemPoint Sales</title>
<meta name="description" content="Free 5-minute assessment for B2B sales teams. Score your team across six areas and get a 90-day plan to close the gaps.">
<link rel="canonical" href="https://gempointadvisors.com/sales-scorecard/">
<meta property="og:title" content="How strong is your sales engine?">
<meta property="og:description" content="Free 24-question sales team assessment with a scored report and 90-day fix plan.">
<meta property="og:image" content="https://gempointadvisors.com/assets/share-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/css/brand/gempoint.css">
<link rel="stylesheet" href="/css/assessment-base.css">
<link rel="stylesheet" href="/css/sales-scorecard.css">
</head>
<body>
<!-- Netlify reads this hidden form at deploy time to register the "scorecard-leads" form and its fields. -->
<form name="scorecard-leads" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field"><input name="name"><input name="email"><input name="phone"><input name="company">
  <input name="team_size"><input name="revenue"><input name="sales_lead">
  <input name="overall"><input name="tier"><input name="top_priorities">
  <input name="strategy_icp"><input name="sales_process"><input name="pipeline_forecasting">
  <input name="people_coaching"><input name="prospecting"><input name="tools_metrics">
  <textarea name="answers"></textarea>
</form>

<div class="wrap" style="padding-bottom:0"><div class="brandbar"><img class="logo lg-light" src="/assets/logos/gempoint-sales-lockup.svg" alt="GemPoint Sales" width="816" height="192"><img class="logo lg-dark" src="/assets/logos/gempoint-sales-lockup-reversed.svg" alt="GemPoint Sales" width="816" height="192"><span class="fine">A practice of GemPoint Advisors</span></div></div>
<main class="wrap" id="app" style="padding-top:0" aria-live="polite"></main>

<script type="module">
import { startScorecard } from "/js/sales-scorecard/app.js";
import settings from "/js/sales-scorecard/settings.js";

startScorecard(document.getElementById("app"), settings);
</script>
</body>
</html>
