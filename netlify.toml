# Netlify settings for gempointadvisors.com
# Plain HTML site: nothing to build, publish the repository as it is.
[build]
  publish = "."
  command = ""

# Short links for print, email and partner materials (query strings such as
# ?partner=plus-inc are passed through automatically).
[[redirects]]
  from = "/ai"
  to = "/ai-readiness/"
  status = 301

# Plus Inc has its own white-label page at /plus/ (plus/index.html).
# Older Plus Inc links and QR codes (/ai-readiness/?partner=plus-inc) are sent there.
[[redirects]]
  from = "/ai-readiness/"
  to = "/plus/"
  status = 301
  force = true
  query = {partner = "plus-inc"}

[[redirects]]
  from = "/scorecard"
  to = "/sales-scorecard/"
  status = 301

[[redirects]]
  from = "/kit"
  to = "/playbook-kit/"
  status = 301

# Booking links: one per Partner, so the booking tool behind them can change
# without touching the site, kits or signatures. 302 because the target may change.
[[redirects]]
  from = "/meet-with-friar"
  to = "https://calendar.app.google/uAdSdYZCHj5WHTkj8"
  status = 302

# Basic security headers on every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Logos and images rarely change, so let browsers cache them for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
