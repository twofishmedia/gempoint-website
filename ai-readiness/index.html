<style>
/* GemPoint Technology: one 760px column; intro → six one-at-a-time questions → contact step → report (score, bottleneck, one task in three steps, take-it-with-you prompt) */
:root{
  --bg:#FAFAF7; --surface:#FFFFFF; --tint:#ECF8F2; --ink:#10244A; --muted:#4B5B76; --line:#DCE2EA;
  --accent:#0A7B57; --accent-deep:#075F43; --accent-soft:#D3F0E3; --on-accent:#FFFFFF;
  --tech:#2F5E9E; --tech-soft:#E6EDF7;
  --bad:#B42318; --bad-soft:#FBE7E5; --warn:#A54C08; --warn-soft:#FBEBDD; --good:#0A7B57; --good-soft:#D3F0E3;
  --cta:#10244A; --on-cta:#FFFFFF; --cta-muted:#C9D2E1; --cta-btn:#3CC08E; --on-cta-btn:#0B1A33; --cta-line:#A8B5CB;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A33; --surface:#12254A; --tint:#10302F; --ink:#EEF2F8; --muted:#A8B5CB; --line:#263B63;
  --accent:#3CC08E; --accent-deep:#6FD1A9; --accent-soft:#1E4A40; --on-accent:#0B1A33;
  --tech:#7FA6DC; --tech-soft:#1B3562;
  --bad:#F97066; --bad-soft:#3A1E26; --warn:#F5A524; --warn-soft:#3A2A12; --good:#3CC08E; --good-soft:#1E4A40;
  --cta:#1B3562; --on-cta:#FFFFFF; --cta-muted:#C9D2E1; --cta-btn:#3CC08E; --on-cta-btn:#0B1A33; --cta-line:#A8B5CB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A33; --surface:#12254A; --tint:#10302F; --ink:#EEF2F8; --muted:#A8B5CB; --line:#263B63;
  --accent:#3CC08E; --accent-deep:#6FD1A9; --accent-soft:#1E4A40; --on-accent:#0B1A33;
  --tech:#7FA6DC; --tech-soft:#1B3562;
  --bad:#F97066; --bad-soft:#3A1E26; --warn:#F5A524; --warn-soft:#3A2A12; --good:#3CC08E; --good-soft:#1E4A40;
  --cta:#1B3562; --on-cta:#FFFFFF; --cta-muted:#C9D2E1; --cta-btn:#3CC08E; --on-cta-btn:#0B1A33; --cta-line:#A8B5CB; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.12}
h1,h2{font-family:var(--display);font-weight:600}
h1{font-size:clamp(2.2rem,6vw,3.3rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4vw,1.9rem)}
h3{font-size:1.1rem;font-weight:600;line-height:1.35}
p{margin:0}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tech)}
.muted{color:var(--muted)}
.fine{font-size:.85rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.brandbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:20px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.brandbar svg{height:56px;width:auto;display:block}
.brandbar .lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brandbar .lg-light{display:none}:root:not([data-theme="light"]) .brandbar .lg-dark{display:block}}
:root[data-theme="dark"] .brandbar .lg-light{display:none}:root[data-theme="dark"] .brandbar .lg-dark{display:block}

button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:13px 22px;font-weight:600;font-size:1rem;min-height:48px}
.btn:hover{background:var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* intro */
.hero{display:flex;flex-direction:column;gap:18px;padding-bottom:28px}
.lede{font-size:1.2rem;max-width:56ch;color:var(--muted)}
.gets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:4px 0 28px}
@media (max-width:520px){.gets{grid-template-columns:1fr}}
.gets div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.gets b{display:block;font-weight:600;margin-bottom:4px}
.gets span{font-size:.95rem;color:var(--muted)}
.areas{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:4px 10px;color:var(--muted)}

/* facet progress: one triangle per question */
.facets{display:flex;gap:6px;margin:14px 0 4px}
.facets i{width:28px;height:16px;background:var(--line);clip-path:polygon(0 100%,50% 0,100% 100%)}
.facets i:nth-child(even){clip-path:polygon(0 0,100% 0,50% 100%)}
.facets i.done{background:var(--accent)}
.facets i.now{background:var(--tech)}

/* question */
.qcard{display:flex;flex-direction:column;gap:20px;margin-top:20px}
.qarea{font-size:.85rem;font-weight:600;color:var(--tech)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:16px 18px;min-height:56px}
.choice:hover{border-color:var(--accent)}
.choice .dot{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.choice[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}

/* multi-select steps */
.group{display:flex;flex-direction:column;gap:10px}
.group legend,.glabel{font-weight:600;font-size:.95rem;padding:0;margin-bottom:2px}
.multi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.multi.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.multi,.multi.three{grid-template-columns:1fr}}
.choice .box{flex:0 0 20px;height:20px;border-radius:4px;border:2px solid var(--line);margin-top:3px}
.choice[aria-pressed="true"] .box{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.hint{font-size:.9rem;color:var(--muted)}
textarea.other{font:inherit;font-size:.95rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);width:100%;min-height:84px;resize:vertical}
textarea.other:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.partner{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;background:var(--tech-soft);color:var(--ink);border-radius:4px;padding:6px 12px;font-size:.9rem;font-weight:500}
.partner b{font-weight:600}
.goals{display:flex;flex-direction:column;gap:12px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.goal b{font-weight:600}
.kv{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:8px 16px;font-size:.95rem}
@media (max-width:520px){.kv{grid-template-columns:1fr}}
.kv dt{font-weight:600}.kv dd{margin:0;color:var(--muted)}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem}
input[type=text],select{font:inherit;font-weight:400;padding:11px 12px;border:1.5px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%;min-height:46px}
.err{color:var(--bad);font-size:.9rem;font-weight:600;min-height:1.4em}

/* report */
.samplenote{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:10px 14px;font-size:.9rem;font-weight:600}
.rhead{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-bottom:28px;border-bottom:2px solid var(--accent)}
@media (max-width:560px){.rhead{grid-template-columns:1fr}}
.gauge{width:156px;height:156px}
.gauge text{font-family:var(--body);font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
section.block{padding:32px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,170px) 1fr 44px;gap:12px;align-items:center}
@media (max-width:520px){.bar{grid-template-columns:1fr 44px}.bar .track{grid-column:1 / -1;grid-row:2}}
.bar .lbl{font-weight:600;font-size:.95rem;min-width:0}
.bar.low .lbl::after{content:" · bottleneck";color:var(--bad);font-weight:600;font-size:.8rem}
.track{height:12px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.num{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bneck{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--bad);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-good{background:var(--good-soft);color:var(--good)}
.task{background:var(--tint);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:4px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.95rem}
.steps b{font-weight:600}
.prompt{width:100%;min-height:200px;font:inherit;font-size:.85rem;line-height:1.5;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:4px;padding:14px;resize:vertical}
.toast{font-size:.9rem;min-height:1.4em;color:var(--accent)}
.cta{background:var(--cta);color:var(--on-cta);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:14px}
.cta h2{color:var(--on-cta)}
.cta p{color:var(--cta-muted)}
.cta .eyebrow{color:var(--cta-btn)}
.cta .btn{background:var(--cta-btn);color:var(--on-cta-btn)}
.cta .btn.ghost{background:transparent;color:var(--on-cta);border-color:var(--cta-line)}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .7s ease}}
</style>
</head>

<main class="wrap" id="app" style="padding-top:0" aria-live="polite"></main>

<script>
/* Edit these to put your contact details on the report. */
const CONTACT = {
  name: "GemPoint Technology",
  email: "sales@gempointadvisors.com",
  booking: ""   // add a Calendly or booking link here when you have one
};

/* Referral partners. Give each partner a link ending in ?partner=<code> (on your own site)
   or #<code> (on this preview link). Their customers see "Shared with you by <name>",
   and every lead records which partner sent it. Unknown codes are still recorded. */
const PARTNERS = {
  "plus-inc": "Plus Inc",
  "example-msp": "Example IT Partners (sample)"
};
const SHARE_WITH_PARTNER = true; // say on the contact step that the referring partner may see results

const AREAS = [
 {id:"strategy", name:"Strategy",
  q:"Where does AI fit in your plans for the next 12 months?",
  opts:["We haven't talked about it","A few people are curious","Leadership has named a few places it could help","We have a written plan with owners and goals"],
  why:"Without agreed priorities, AI spending goes to whatever tool someone saw last week, and nothing gets measured.",
  task:{title:"Pick three places AI should help this year", steps:[
   ["List your biggest time drains","Ask each leader for the two tasks that eat the most hours on their team each week."],
   ["Score them by value and effort","Rate each one 1–5 on time saved and 1–5 on how hard it is to change. Keep the top three."],
   ["Give each one an owner and a goal","Name one person per item and a number to hit in 90 days, such as hours saved or turnaround time."]]}},
 {id:"data", name:"Data",
  q:"If you needed a report on last quarter's customers, how would you get it?",
  opts:["Dig through email, paper and spreadsheets","Pull from several systems and piece it together by hand","Mostly from one system, with some cleanup","Straight from one trusted system in a few minutes"],
  why:"AI is only as good as the information you give it. Scattered or messy data means unreliable answers.",
  task:{title:"Name one source of truth for customer data", steps:[
   ["Choose the system of record","Pick the one place customer information officially lives, usually your CRM or accounting system."],
   ["Clean your top 100 records","Merge duplicates, fill missing contacts, and fix company names for your most important customers."],
   ["Set the rule going forward","New customer information goes into that system first. Spreadsheets become views, not sources."]]}},
 {id:"systems", name:"Systems",
  q:"How connected are your core systems, like CRM, accounting and operations?",
  opts:["Mostly paper and separate spreadsheets","Separate apps that don't talk to each other","Some are connected, some data is re-typed by hand","Connected, with data flowing between them automatically"],
  why:"AI tools and automations need to reach your systems. Disconnected apps keep people re-typing the same data.",
  task:{title:"Map how your systems connect", steps:[
   ["List every core system","Write down each business app, what it's used for, who owns it, and what it costs per year."],
   ["Mark the manual hand-offs","Highlight every place someone copies data from one system into another."],
   ["Automate one hand-off","Pick the most frequent manual hand-off and connect it, with a built-in integration or a tool like Zapier or Power Automate."]]}},
 {id:"people", name:"People",
  q:"How is your team using AI tools today?",
  opts:["Not at all, as far as we know","A few people on their own, with personal accounts","Some teams use approved tools for specific tasks","Widely, with training and shared practices"],
  why:"Tools don't change anything until people use them well. Untrained, unofficial use creates risk without much payoff.",
  task:{title:"Run a 30-day AI pilot with one team", steps:[
   ["Pick one team and two tasks","Choose a willing team and two repetitive tasks, like drafting proposals or summarizing calls."],
   ["Give them an approved tool and an hour of training","Provide business accounts, not personal ones, and show real examples using your own work."],
   ["Measure and share the results","Track time saved for 30 days, then have the team show the rest of the company what worked."]]}},
 {id:"governance", name:"Governance",
  q:"Do you have rules for what employees can put into AI tools?",
  opts:["No, and we're not sure what's being shared","Informal guidance only","A written policy that isn't enforced yet","A written policy, approved tools, and controls to enforce it"],
  why:"Without clear rules, customer data, pricing and contracts can end up in tools you don't control.",
  task:{title:"Put an AI use policy in place", steps:[
   ["Find out what's in use","Run a short anonymous survey asking which AI tools people use and what they use them for."],
   ["Write a one-page policy","Cover approved tools, what data never goes into AI, and who to ask when unsure."],
   ["Move to business accounts","Pick approved tools with business terms that keep your data out of training, and retire personal accounts for work."]]}},
 {id:"processes", name:"Processes",
  q:"How well are your repeatable processes, like quoting, onboarding and invoicing, written down?",
  opts:["They live in people's heads","Some notes, mostly out of date","Key processes are written down","Documented, measured and reviewed regularly"],
  why:"You can't hand a process to AI, or to a new hire, if it only exists in someone's head.",
  task:{title:"Document the one process AI could help most", steps:[
   ["Pick a high-volume process","Choose something done often with clear inputs and outputs, like quotes, intake or invoicing."],
   ["Write it as a checklist","List each step, who does it, and what information they use, the way you'd teach a new hire."],
   ["Time it for a week","Record how long each run takes. That baseline shows whether AI actually saves time later."]]}}
];
/* Ties go to the most foundational area first. */
const FOUNDATION = ["governance","data","processes","systems","people","strategy"];
const SIZES = ["1–10","11–50","51–200","201+"];
const HOPES = [
  ["Cut time on admin and repetitive work","Draft routine emails, fill in forms and update records automatically."],
  ["Respond to customers faster","AI-drafted replies and a help assistant that answers from your own FAQs and policies."],
  ["Speed up quotes, proposals or invoicing","First-draft quotes and proposals built from your price list and past work."],
  ["Get better reports and forecasts","Ask questions of your sales and finance data in plain English."],
  ["Grow sales and marketing","Personal outreach, follow-ups and content at a pace a small team can keep up with."],
  ["Train and onboard staff faster","An internal assistant that answers \u201chow do we do this?\u201d from your documented processes."],
  ["Reduce IT and security risk","Approved tools, a clear policy, and visibility into what data leaves the company."],
  ["Get more from tools we already pay for","Turn on and train people on the AI already included in your Microsoft 365, Google or CRM plans."]
];
const EXTRAS = [
  {title:"How is your business using AI today?", sub:"Pick all that apply. This part isn't scored. It helps tailor your plan.",
   groups:[
    {key:"tools", label:"Tools in use", none:"None yet", opts:["ChatGPT","Microsoft Copilot","Google Gemini","Claude","AI built into our software (CRM, accounting, etc.)","None yet"]},
    {key:"uses", label:"What it's used for", none:"Nothing yet", opts:["Writing emails and documents","Summarizing meetings and notes","Customer service or chat","Sales and marketing content","Reports and data analysis","IT, coding or automation","Research and planning","Nothing yet"]}]},
  {title:"What do you most hope AI could do for your business?", sub:"Pick up to three, and tell us anything we missed.",
   groups:[{key:"hopes", label:"Your top hopes", max:3, opts:HOPES.map(h=>h[0])}], other:true, timeline:true}
];
const TIMELINES = ["In the next 3 months","In 3–12 months","Just exploring for now"];
const TOTAL = AREAS.length + EXTRAS.length;
const SAMPLE = {company:"Example Co. (sample)", size:"11–50", ans:{strategy:1,data:1,systems:2,people:1,governance:0,processes:2},
  extra:{tools:["ChatGPT","Microsoft Copilot"], uses:["Writing emails and documents","Summarizing meetings and notes"], hopes:["Respond to customers faster","Speed up quotes, proposals or invoicing"], other:"", timeline:"In 3–12 months"}};
const blankExtra = () => ({tools:[], uses:[], hopes:[], other:"", timeline:""});

function detectPartner(){
  let code = "";
  try { const q = new URLSearchParams(location.search); code = q.get("partner") || q.get("ref") || ""; } catch(e){}
  if(!code){ const h = (location.hash||"").slice(1); if(/^[A-Za-z0-9-]{2,40}$/.test(h)) code = h; }
  code = code.trim().toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,40);
  return code ? {code, name: PARTNERS[code] || ""} : null;
}

let state = {view:"intro", step:0, ans:{}, extra:blankExtra(), sample:false, partner:detectPartner(), contact:{name:"",email:"",phone:"",company:"",size:""}, submitted:false};

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const areaScore = v => Math.round(v/3*100);
const band = s => s<40?"bad":s<67?"warn":"good";
const bandLabel = s => s<40?"Gap":s<67?"Developing":"Strength";
const tier = s => s<40?["Getting started","AI could help, but the foundations aren't there yet. Fix the basics first so your first projects don't stall."]
  : s<60?["Laying the groundwork","Some pieces are in place. Close your biggest gap and you'll be ready to run a real pilot."]
  : s<80?["Ready to pilot","Your foundations can support focused AI projects. Pick one with a clear goal and measure it."]
  : ["Ready to scale","You're well set up. The opportunity now is rolling AI out across teams with consistent rules."];

function go(view){ state.view=view; render(); window.scrollTo(0,0); }
function render(){ ({intro:renderIntro,q:renderQ,gate:renderGate,report:renderReport})[state.view](); }

function renderIntro(){
  app.innerHTML = `
  <header class="hero">
    ${state.partner && state.partner.name ? `<span class="partner">Shared with you by <b>${esc(state.partner.name)}</b></span>` : ""}
    <span class="eyebrow">Free AI readiness check · 8 questions · 3 minutes</span>
    <h1>Is your business ready for AI?</h1>
    <p class="lede">Answer eight quick questions about how your company runs and how you use AI today. You'll get a readiness score, the area holding you back most, and one task to start on this week.</p>
  </header>
  <div class="gets">
    <div><b>A score out of 100</b><span>Where you stand across six areas that decide whether AI pays off.</span></div>
    <div><b>Your biggest bottleneck</b><span>The one area slowing everything else down.</span></div>
    <div><b>One task, three steps</b><span>A concrete first move you can start without buying anything.</span></div>
    <div><b>Take it with you</b><span>A ready-made prompt to rerun this in ChatGPT, Claude, Copilot or Gemini.</span></div>
  </div>
  <div class="areas" aria-label="Areas assessed">${AREAS.map(a=>`<span class="tag">${a.name}</span>`).join("")}</div>
  <div class="row">
    <button class="btn" type="button" id="start">Start the assessment</button>
    <button class="btn ghost" type="button" id="sample">See a sample report</button>
  </div>
  <p class="fine" style="margin-top:20px">Built by GemPoint Technology, the technology consulting and integration practice of GemPoint Advisors.</p>`;
  document.getElementById("start").addEventListener("click",()=>{ state.sample=false; state.step=0; go("q"); });
  document.getElementById("sample").addEventListener("click",()=>{
    state.sample=true; state.ans={...SAMPLE.ans}; state.extra=JSON.parse(JSON.stringify(SAMPLE.extra)); state.contact={...state.contact, company:SAMPLE.company, size:SAMPLE.size}; go("report");
  });
}

function facets(){ return `<div class="facets" aria-hidden="true">${Array.from({length:TOTAL},(x,k)=>`<i class="${k<state.step?"done":k===state.step?"now":""}"></i>`).join("")}</div>`; }
function renderQ(){
  if(state.step>=AREAS.length) return renderExtra();
  const a = AREAS[state.step], cur = state.ans[a.id];
  app.innerHTML = `
  <span class="eyebrow">Question ${state.step+1} of ${TOTAL}</span>
  ${facets()}
  <div class="qcard">
    <span class="qarea">${a.name}</span>
    <h2 id="qh">${esc(a.q)}</h2>
    <div class="choices" role="group" aria-labelledby="qh">
      ${a.opts.map((o,k)=>`<button type="button" class="choice" id="${a.id}-${k}" data-v="${k}" aria-pressed="${cur===k}"><span class="dot" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join("")}
    </div>
    <div class="navrow">
      <button type="button" class="btn ghost" id="back">${state.step===0?"Back to start":"Previous"}</button>
      <button type="button" class="btn" id="next" ${cur===undefined?"disabled":""}>Next</button>
    </div>
  </div>`;
  app.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
    state.ans[a.id] = +b.dataset.v;
    app.querySelectorAll(".choice").forEach(x=>x.setAttribute("aria-pressed", x===b));
    document.getElementById("next").disabled = false;
    setTimeout(advance, 260);
  }));
  document.getElementById("next").addEventListener("click", advance);
  document.getElementById("back").addEventListener("click",()=>{ if(state.step===0) go("intro"); else { state.step--; go("q"); } });
}
function advance(){
  if(state.view!=="q" || state.step>=AREAS.length || state.ans[AREAS[state.step].id]===undefined) return;
  state.step++; go("q");
}

function extraDone(x){
  const e = state.extra;
  return x.groups.every(g=>e[g.key].length>0) && (!x.timeline || e.timeline);
}
function renderExtra(){
  const x = EXTRAS[state.step-AREAS.length], e = state.extra, last = state.step===TOTAL-1;
  app.innerHTML = `
  <span class="eyebrow">Question ${state.step+1} of ${TOTAL}</span>
  ${facets()}
  <div class="qcard">
    <span class="qarea">Your AI picture</span>
    <h2>${esc(x.title)}</h2>
    <p class="hint">${esc(x.sub)}</p>
    ${x.groups.map(g=>`<div class="group" role="group" aria-labelledby="g-${g.key}">
      <span class="glabel" id="g-${g.key}">${esc(g.label)}${g.max?` <span class="hint" id="cnt-${g.key}">(${e[g.key].length} of ${g.max})</span>`:""}</span>
      <div class="multi">${g.opts.map((o,k)=>`<button type="button" class="choice" id="${g.key}-${k}" data-g="${g.key}" data-o="${esc(o)}" aria-pressed="${e[g.key].includes(o)}"><span class="box" aria-hidden="true"></span><span>${esc(o)}</span></button>`).join("")}</div>
    </div>`).join("")}
    ${x.other?`<label class="f" for="hopes-other">Anything else you'd like AI to help with? (optional)<textarea class="other" id="hopes-other">${esc(e.other)}</textarea></label>`:""}
    ${x.timeline?`<div class="group" role="group" aria-labelledby="g-tl"><span class="glabel" id="g-tl">When would you like to act on this?</span>
      <div class="multi three">${TIMELINES.map((t,k)=>`<button type="button" class="choice" id="tl-${k}" data-tl="${esc(t)}" aria-pressed="${e.timeline===t}"><span class="dot" aria-hidden="true"></span><span>${esc(t)}</span></button>`).join("")}</div></div>`:""}
    <div class="navrow">
      <button type="button" class="btn ghost" id="back">Previous</button>
      <button type="button" class="btn" id="next" ${extraDone(x)?"":"disabled"}>${last?"See my results":"Next"}</button>
    </div>
  </div>`;
  const next = document.getElementById("next");
  const groupOf = k => x.groups.find(g=>g.key===k);
  app.querySelectorAll("[data-g]").forEach(b=>b.addEventListener("click",()=>{
    const g = groupOf(b.dataset.g), list = e[g.key], o = b.dataset.o;
    let sel = list.includes(o) ? list.filter(v=>v!==o) : [...list, o];
    if(g.none){ if(o===g.none) sel = list.includes(o) ? [] : [g.none]; else sel = sel.filter(v=>v!==g.none); }
    if(g.max && sel.length>g.max) sel = sel.slice(sel.length-g.max);
    e[g.key] = sel;
    app.querySelectorAll(`[data-g="${g.key}"]`).forEach(c=>c.setAttribute("aria-pressed", sel.includes(c.dataset.o)));
    const cnt = document.getElementById("cnt-"+g.key); if(cnt) cnt.textContent = `(${sel.length} of ${g.max})`;
    next.disabled = !extraDone(x);
  }));
  app.querySelectorAll("[data-tl]").forEach(b=>b.addEventListener("click",()=>{
    e.timeline = b.dataset.tl;
    app.querySelectorAll("[data-tl]").forEach(c=>c.setAttribute("aria-pressed", c===b));
    next.disabled = !extraDone(x);
  }));
  const other = document.getElementById("hopes-other");
  if(other) other.addEventListener("input",()=>{ e.other = other.value.slice(0,1000); });
  next.addEventListener("click",()=>{ if(!extraDone(x)) return; if(last) go("gate"); else { state.step++; go("q"); } });
  document.getElementById("back").addEventListener("click",()=>{ state.step--; go("q"); });
}

function renderGate(){
  const c = state.contact;
  app.innerHTML = `
  <span class="eyebrow">Last step</span>
  <div class="facets" aria-hidden="true">${Array.from({length:TOTAL},()=>`<i class="done"></i>`).join("")}</div>
  <h2 style="margin-top:16px">Your results are ready</h2>
  <p class="muted" style="margin-top:8px">Tell us where to send a copy and your full report opens on the next screen.</p>
  <form class="panel stack" id="gf" style="margin-top:20px" novalidate>
    <div class="grid2">
      <label class="f" for="lead-name">Your name<input type="text" id="lead-name" autocomplete="name" value="${esc(c.name)}"></label>
      <label class="f" for="lead-email">Work email<input type="text" id="lead-email" inputmode="email" autocomplete="email" value="${esc(c.email)}"></label>
      <label class="f" for="lead-company">Company<input type="text" id="lead-company" autocomplete="organization" value="${esc(c.company)}"></label>
      <label class="f" for="lead-size">Number of employees
        <select id="lead-size"><option value="">Choose one</option>${SIZES.map(s=>`<option ${c.size===s?"selected":""}>${s}</option>`).join("")}</select></label>
      <label class="f" for="lead-phone">Phone (optional)<input type="text" id="lead-phone" inputmode="tel" autocomplete="tel" value="${esc(c.phone)}"></label>
    </div>
    <p class="err" id="gerr"></p>
    <div class="navrow" style="margin-top:0">
      <button type="button" class="btn ghost" id="gback">Previous</button>
      <button type="submit" class="btn" id="gsend">Show my results</button>
    </div>
    <p class="fine">GemPoint Technology will see your results and may follow up once${state.partner && state.partner.name && SHARE_WITH_PARTNER ? `, and may share them with ${esc(state.partner.name)}, who introduced you` : ""}. Your information is never sold.</p>
  </form>`;
  document.getElementById("gback").addEventListener("click",()=>{ state.step=TOTAL-1; go("q"); });
  document.getElementById("gf").addEventListener("submit", async e=>{
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const err = document.getElementById("gerr");
    if(!v("lead-name")){ err.textContent="Enter your name to see your results."; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("lead-email"))){ err.textContent="Enter a valid email address, like you@company.com."; return; }
    if(v("lead-phone") && phoneDigits(v("lead-phone")).length!==10){ err.textContent="Enter a 10-digit phone number, like (864) 555-0100, or leave it blank."; return; }
    state.contact = {name:v("lead-name"), email:v("lead-email"), phone:formatPhone(v("lead-phone")), company:v("lead-company"), size:v("lead-size")};
    const btn = document.getElementById("gsend"); btn.disabled=true; btn.textContent="Building your report…";
    try { await sendLead(); state.submitted=true; } catch(x){ state.submitted=false; }
    state.sample=false; go("report");
  });
}

function analyze(){
  const areas = AREAS.map(a=>({...a, v:state.ans[a.id], s:areaScore(state.ans[a.id])}));
  const overall = Math.round(areas.reduce((t,a)=>t+a.s,0)/areas.length);
  const low = Math.min(...areas.map(a=>a.s));
  const bottleneck = FOUNDATION.map(id=>areas.find(a=>a.id===id)).find(a=>a.s===low);
  return {areas, overall, bottleneck};
}

async function sendLead(){
  const {areas, overall, bottleneck} = analyze();
  const e = state.extra, pt = state.partner;
  const f = {"form-name":"ai-readiness-leads","bot-field":"",
    partner: pt ? (pt.name || pt.code) : "", partner_code: pt ? pt.code : "",
    ai_tools:e.tools.join("; "), ai_uses:e.uses.join("; "), ai_hopes:e.hopes.join("; "), ai_hopes_other:e.other, timeline:e.timeline,
    name:state.contact.name, email:state.contact.email, phone:state.contact.phone, company:state.contact.company, company_size:state.contact.size,
    overall:String(overall), tier:tier(overall)[0], bottleneck:bottleneck.name,
    answers: areas.map(a=>`${a.name}: ${a.opts[a.v]}`).join("\n")};
  areas.forEach(a=>f[a.id]=String(a.s));
  const res = await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(f).toString()});
  if(!res.ok) throw new Error("submit failed");
}

function gauge(score){
  const r=64, C=2*Math.PI*r, off=C*(1-score/100);
  return `<svg class="gauge" viewBox="0 0 156 156" role="img" aria-label="AI readiness score ${score} out of 100">
    <circle cx="78" cy="78" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="78" cy="78" r="${r}" fill="none" stroke="var(--${band(score)})" stroke-width="12" stroke-linecap="butt"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 78 78)"/>
    <text x="78" y="84" text-anchor="middle" font-size="40">${score}</text>
    <text x="78" y="108" text-anchor="middle" font-size="12" style="fill:var(--muted)">out of 100</text></svg>`;
}

function promptText(areas, overall, bottleneck){
  const c = state.contact;
  return [
    "Act as an experienced IT and AI advisor for small and mid-sized businesses.",
    "I took a short AI readiness assessment. Here are my answers:",
    "",
    ...areas.map(a=>`- ${a.name}: ${a.q} → "${a.opts[a.v]}"`),
    "",
    `AI tools we use today: ${state.extra.tools.join(", ")||"not answered"}.`,
    `What we use AI for today: ${state.extra.uses.join(", ")||"not answered"}.`,
    `What we most hope AI can do: ${state.extra.hopes.join(", ")||"not answered"}${state.extra.other?". Also: "+state.extra.other:""}.`,
    `When we'd like to act: ${state.extra.timeline||"not answered"}.`,
    `Company size: ${c.size||"[number of employees]"} employees. Industry: [your industry].`,
    `My score was ${overall}/100, and my biggest bottleneck was ${bottleneck.name}.`,
    "",
    "Please:",
    "1. Score my readiness in each of the six areas from 0 to 100 and explain each score in one sentence.",
    "2. Confirm or challenge my biggest bottleneck.",
    "3. Give me a 90-day plan: one priority per month, each with three concrete steps.",
    "4. For each of my hopes, suggest one specific AI use case and what has to be true before it works.",
    "Ask me follow-up questions first if any answer is unclear."
  ].join("\n");
}

function renderReport(){
  const {areas, overall, bottleneck} = analyze();
  const [tname, tdesc] = tier(overall);
  const who = state.contact.company ? esc(state.contact.company) : "Your business";
  const t = bottleneck.task;
  app.innerHTML = `
  ${state.sample?`<p class="samplenote" style="margin-bottom:20px">This is a sample report with example answers. Take the assessment to see your own.</p>`:""}
  <header class="rhead">
    ${gauge(overall)}
    <div class="stack" style="gap:10px;min-width:0">
      <span class="eyebrow">AI readiness · ${who}</span>
      <h1 style="font-size:clamp(2rem,5vw,2.7rem)">${tname}</h1>
      <p class="muted">${tdesc}</p>
    </div>
  </header>

  <section class="block">
    <h2>Score by area</h2>
    <div class="bars">${areas.map(a=>`<div class="bar ${a.id===bottleneck.id?"low":""}"><span class="lbl">${a.name}</span>
      <div class="track"><i style="width:${Math.max(a.s,3)}%;background:var(--${band(a.s)})"></i></div>
      <span class="num">${a.s}</span></div>`).join("")}</div>
  </section>

  <section class="block">
    <div class="bneck">
      <span class="eyebrow" style="color:var(--bad)">Your biggest bottleneck</span>
      <div class="row" style="justify-content:space-between"><h2>${bottleneck.name}</h2><span class="pill p-${band(bottleneck.s)}">${bottleneck.s} · ${bandLabel(bottleneck.s)}</span></div>
      <p class="muted">You answered: “${esc(bottleneck.opts[bottleneck.v])}”</p>
      <p>${esc(bottleneck.why)}</p>
    </div>
    <div class="task">
      <span class="eyebrow" style="color:var(--accent)">Your next task</span>
      <h3 style="font-size:1.3rem">${esc(t.title)}</h3>
      <ol class="steps">${t.steps.map(([h,d])=>`<li><span><b>${esc(h)}.</b> ${esc(d)}</span></li>`).join("")}</ol>
    </div>
  </section>

  <section class="block">
    <h2>Where AI could help you first</h2>
    <p class="muted">Based on what you hope AI will do. ${overall<40?"Finish your next task first, so these have a foundation to build on.":overall<60?"Pick one of these for a small pilot once your next task is underway.":"Your foundations can support a pilot on one of these now."}</p>
    <div class="goals">${state.extra.hopes.map(h=>{ const m = HOPES.find(x=>x[0]===h); return `<div class="goal"><b>${esc(h)}</b><span class="muted">${esc(m?m[1]:"")}</span></div>`; }).join("")}
    ${state.extra.other?`<div class="goal"><b>Also on your list</b><span class="muted">${esc(state.extra.other)}</span></div>`:""}</div>
    <dl class="kv">
      <dt>AI tools today</dt><dd>${esc(state.extra.tools.join(", "))}</dd>
      <dt>Used today for</dt><dd>${esc(state.extra.uses.join(", "))}</dd>
      <dt>Timeline</dt><dd>${esc(state.extra.timeline)}</dd>
    </dl>
  </section>

  <section class="block">
    <h2>Take it with you</h2>
    <p class="muted">Paste this prompt into ChatGPT, Claude, Copilot or Gemini to go deeper on your answers. Add your industry where it says [your industry].</p>
    <label class="fine" for="prompt" style="font-weight:600">Your assessment prompt</label>
    <textarea class="prompt" id="prompt" readonly>${esc(promptText(areas, overall, bottleneck))}</textarea>
    <div class="row"><button class="btn ghost" type="button" id="copyprompt">Copy prompt</button><span class="toast" id="ptoast" role="status"></span></div>
  </section>

  <section class="block" style="border-bottom:0">
    <div class="cta">
      <span class="eyebrow">Next step</span>
      <h2>Want a second opinion on your plan?</h2>
      <p>${state.partner && state.partner.name ? `GemPoint Technology works alongside ${esc(state.partner.name)} to help businesses like yours put AI to work. ` : ""}GemPoint Technology plans and delivers AI and integration projects alongside your IT team or provider. We'll walk through your results, check them against how your business actually runs, and tell you what we'd do first.
      ${state.submitted?" We have a copy of your answers, so a free 30-minute review can start right where this report ends.":""}</p>
      ${CONTACT.email?`<p style="user-select:all;font-weight:600;color:var(--on-cta)">${esc(CONTACT.email)}</p>`:""}
      <div class="row">
        ${CONTACT.booking?`<a class="btn" href="${esc(CONTACT.booking)}" target="_blank" rel="noopener" style="text-decoration:none">Book a free AI review</a>`:""}
        <button class="btn ${CONTACT.booking?"ghost":""}" type="button" id="copysum">Copy my results</button>
        <button class="btn ghost" type="button" id="retake">${state.sample?"Take the assessment":"Retake"}</button>
      </div>
      <p class="toast" id="stoast" role="status" style="color:var(--cta-btn)"></p>
    </div>
  </section>`;

  const copy = (txt, toastId, ok, fallbackEl) => {
    const toast = document.getElementById(toastId);
    const fb = () => { if(fallbackEl){ fallbackEl.focus(); fallbackEl.select(); } toast.textContent = "Select the text and copy it."; };
    try { navigator.clipboard.writeText(txt).then(()=>{ toast.textContent = ok; }, fb); } catch(e){ fb(); }
  };
  document.getElementById("copyprompt").addEventListener("click",()=>{
    const ta = document.getElementById("prompt"); copy(ta.value, "ptoast", "Prompt copied.", ta);
  });
  document.getElementById("copysum").addEventListener("click",()=>{
    const txt = [`AI Readiness Check${state.contact.company?" — "+state.contact.company:""}`, `Score: ${overall}/100 (${tname})`, `Biggest bottleneck: ${bottleneck.name}`, "", ...areas.map(a=>`- ${a.name}: ${a.s}`), "", `Next task: ${t.title}`, `Top hopes for AI: ${state.extra.hopes.join("; ")}`, `Timeline: ${state.extra.timeline}`].join("\n");
    copy(txt, "stoast", "Results copied. Paste them into an email.", document.getElementById("prompt"));
  });
  document.getElementById("retake").addEventListener("click",()=>{
    state.ans={}; state.extra=blankExtra(); if(state.sample) state.contact={...state.contact, company:"", size:""};
    state.sample=false; state.submitted=false; state.step=0; go(state.contact.email?"q":"intro");
  });
}

render();
</script>
<script>
/* Phone fields (autocomplete="tel"): format as (xxx) xxx-xxxx while typing or pasting. */
(function(){
  function digits(v){ var d=String(v||"").replace(/\D/g,""); if(d.length===11&&d.charAt(0)==="1") d=d.slice(1); return d.slice(0,10); }
  function fmt(v){ var d=digits(v); if(!d) return "";
    if(d.length<4) return "("+d; if(d.length<7) return "("+d.slice(0,3)+") "+d.slice(3);
    return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6); }
  window.phoneDigits=digits; window.formatPhone=fmt;
  document.addEventListener("input",function(e){
    var t=e.target; if(!t||t.getAttribute("autocomplete")!=="tel") return;
    var before=t.value.slice(0,t.selectionStart||0).replace(/\D/g,"").length;
    var f=fmt(t.value); if(f===t.value) return; t.value=f;
    var pos=0,seen=0; while(pos<f.length&&seen<before){ if(/\d/.test(f.charAt(pos))) seen++; pos++; }
    try{ t.setSelectionRange(pos,pos); }catch(_){}
  });
})();
</script>
